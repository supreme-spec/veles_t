server {
    listen 80;
    listen [::]:80;
    server_name veles-voyage.ru www.veles-voyage.ru velesvoyage.ru www.velesvoyage.ru;
    return 301 https://veles-voyage.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.veles-voyage.ru www.velesvoyage.ru;
    ssl_certificate /etc/letsencrypt/live/veles-voyage.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veles-voyage.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://veles-voyage.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name veles-voyage.ru velesvoyage.ru;
    ssl_certificate /etc/letsencrypt/live/veles-voyage.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veles-voyage.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;
    add_header X-DNS-Prefetch-Control "on" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Proxy to Next.js app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
